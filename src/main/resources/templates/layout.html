<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Torque Gestão'">Torque Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('torque-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg></span>
            <span>Torque Gestão<small>Painel da oficina</small></span>
        </a>
        <nav class="nav" aria-label="Navegação principal">
            <div class="nav-label" sec:authorize="hasAnyRole('ADMIN','MANAGER')">Visão geral</div>
            <a th:href="@{/}" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:classappend="${currentPath == '/'} ? 'active'" th:attr="aria-current=${currentPath == '/'} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard</a>
            <div class="nav-label">Cadastros</div>
            <a th:href="@{/clients}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','MANAGER')" th:classappend="${#strings.startsWith(currentPath, '/clients')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/clients')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Clientes</a>
            <a th:href="@{/vehicles}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','MANAGER','MECHANIC')" th:classappend="${#strings.startsWith(currentPath, '/vehicles')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/vehicles')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                Veículos</a>
            <a th:href="@{/mechanics}" sec:authorize="hasAnyRole('ADMIN','MANAGER','RECEPTIONIST')" th:classappend="${#strings.startsWith(currentPath, '/mechanics')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/mechanics')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg>
                Mecânicos</a>
            <div class="nav-label">Operação</div>
            <a th:href="@{/service-orders}" sec:authorize="hasAnyRole('ADMIN','MANAGER','RECEPTIONIST','MECHANIC')" th:classappend="${#strings.startsWith(currentPath, '/service-orders')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/service-orders')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                Ordens de serviço</a>
            <a th:href="@{/budgets}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','MANAGER')" th:classappend="${#strings.startsWith(currentPath, '/budgets')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/budgets')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                Orçamentos</a>
            <div class="nav-label" sec:authorize="hasAnyRole('ADMIN','MANAGER')">Suprimentos</div>
            <a th:href="@{/inventory}" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:classappend="${#strings.startsWith(currentPath, '/inventory')} ? 'active'" th:attr="aria-current=${#strings.startsWith(currentPath, '/inventory')} ? 'page'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                Estoque</a>
        </nav>
        <div class="sidebar-user">
            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.principal.name,0,1))}"
                  th:style="'--h:' + ${(#strings.length(#authentication.principal.name) * 37) % 360}">U</span>
            <div class="who">
                <b th:text="${#authentication.principal.name}">Usuário</b>
                <span th:text="${#authentication.principal.role.label}">Perfil</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="icon-btn" aria-label="Sair" title="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </form>
        </div>
    </aside>

    <div class="main-col">
        <header class="topbar">
            <button type="button" class="icon-btn menu-toggle" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            </button>
            <div class="crumb">
                <span>Torque Gestão</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                <b th:text="${title}">Página</b>
            </div>
            <button type="button" class="icon-btn theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
                <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </header>

        <div class="content">
            <div class="alert success" role="status" th:if="${success}" th:text="${success}"></div>
            <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>
            <th:block th:replace="${content}"/>
        </div>
    </div>
</div>
</body>
</html>
