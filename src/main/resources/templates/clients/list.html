<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Clientes', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Clientes</h1>
            <p>Gerencie todos os clientes da oficina</p>
        </div>
        <a class="btn" th:href="@{/clients/new}" data-modal sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Novo Cliente
        </a>
    </div>

    <div class="card">
        <div class="table-toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" placeholder="Buscar por nome, CPF ou email..." data-search-table="clients">
            </div>
            <select class="filter-select" data-filter-table="clients">
                <option value="">Todos os status</option>
                <option value="active">Ativos</option>
                <option value="inactive">Inativos</option>
            </select>
        </div>

        <div class="table-wrap">
            <table data-table="clients">
                <thead>
                <tr><th class="col-grow">Nome</th><th class="col-fit">CPF</th><th class="col-fit">Telefone</th><th class="col-grow">Email</th><th class="col-fit">Veículos</th><th class="col-fit">Status</th><th class="col-actions"></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clients}" th:attr="data-filter=${c.active() ? 'active' : 'inactive'}">
                    <td class="strong col-grow" th:text="${c.name()}">Nome</td>
                    <td class="col-fit" th:text="${@fmt.cpf(c.cpf())}">—</td>
                    <td class="col-fit" th:text="${@fmt.phone(c.phone())}">—</td>
                    <td class="col-grow" th:text="${@fmt.dash(c.email())}">—</td>
                    <td class="col-fit"><span class="badge count" th:text="${c.vehicleCount()}">0</span></td>
                    <td class="col-fit"><span class="badge" th:classappend="${c.active()} ? 'moss' : 'neutral'"
                              th:text="${c.active()} ? 'Ativo' : 'Inativo'">Ativo</span></td>
                    <td class="col-actions">
                        <div class="row-menu" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
                            <button type="button" class="menu-btn" aria-label="Ações">⋮</button>
                            <div class="menu-dropdown">
                                <a th:href="@{/clients/{id}/edit(id=${c.id()})}" data-modal>Editar</a>
                                <form th:action="@{/clients/{id}/activate(id=${c.id()})}" method="post" th:unless="${c.active()}">
                                    <button type="submit">Ativar</button>
                                </form>
                                <form th:action="@{/clients/{id}/delete(id=${c.id()})}" method="post"
                                      th:attr="data-confirm='Tem certeza que deseja excluir ' + ${c.name()} + '? O cliente ficará inativo e poderá ser reativado depois.'">
                                    <button type="submit" class="danger">Excluir</button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="7" style="padding: 0; border: none;">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                            <h3>Nenhum cliente cadastrado</h3>
                            <p>Comece cadastrando seu primeiro cliente clicando no botão acima.</p>
                            <a class="btn sm" th:href="@{/clients/new}" data-modal sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">+ Cadastrar primeiro cliente</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
