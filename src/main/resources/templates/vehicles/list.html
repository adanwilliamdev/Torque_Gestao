<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Veículos', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Veículos</h1>
            <p>Gerencie os veículos da oficina</p>
        </div>
        <a class="btn" th:href="@{/vehicles/new}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Novo Veículo
        </a>
    </div>

    <div class="card">
        <div class="table-toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" placeholder="Buscar por placa, marca ou cliente..." data-search-table="vehicles">
            </div>
            <select class="filter-select" data-filter-table="vehicles">
                <option value="">Todos os status</option>
                <option value="active">Ativos</option>
                <option value="inactive">Inativos</option>
            </select>
        </div>

        <div class="table-wrap">
            <table data-table="vehicles">
                <thead>
                <tr><th class="col-fit">Placa</th><th class="col-fit">Marca</th><th class="col-grow">Modelo</th><th class="col-fit">Ano</th><th class="col-fit">Quilometragem</th><th class="col-grow">Cliente</th><th class="col-fit">Status</th><th class="col-actions"></th></tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehicles}" th:attr="data-filter=${v.active() ? 'active' : 'inactive'}">
                    <td class="col-fit"><span class="plate" th:text="${v.plate()}">ABC1D23</span></td>
                    <td class="col-fit" th:text="${v.brand()}">Marca</td>
                    <td class="col-grow" th:text="${v.model()}">Modelo</td>
                    <td class="col-fit" th:text="${v.year()}">2020</td>
                    <td class="col-fit" th:text="${@fmt.km(v.mileage())}">—</td>
                    <td class="col-grow" th:text="${v.clientName()}">Cliente</td>
                    <td class="col-fit"><span class="badge" th:classappend="${v.active()} ? 'moss' : 'neutral'"
                              th:text="${v.active()} ? 'Ativo' : 'Inativo'">Ativo</span></td>
                    <td class="col-actions">
                        <div class="row-menu" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
                            <button type="button" class="menu-btn" aria-label="Ações">⋮</button>
                            <div class="menu-dropdown">
                                <a th:href="@{/vehicles/{id}/edit(id=${v.id()})}">Editar</a>
                            </div>
                        </div>
                    </td>
                </tr>
                <!-- Empty State para tabela vazia -->
                <tr th:if="${#lists.isEmpty(vehicles)}">
                    <td colspan="8" style="padding: 0; border: none;">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
                                <path d="M15 18H9"/>
                                <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/>
                                <circle cx="17" cy="18" r="2"/>
                                <circle cx="7" cy="18" r="2"/>
                            </svg>
                            <h3>Nenhum veículo cadastrado</h3>
                            <p>Comece adicionando o primeiro veículo da sua oficina.</p>
                            <a class="btn sm" th:href="@{/vehicles/new}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">+ Cadastrar primeiro veículo</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
