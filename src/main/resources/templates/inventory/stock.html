<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${kind.name() == 'ENTRADA' ? 'Entrada de estoque' : 'Saída de estoque'}, ~{::main})}">
<body>
<main>
  <div class="page-header">
    <div>
      <h1 th:text="${kind.name() == 'ENTRADA'} ? 'Entrada de estoque' : 'Saída de estoque'">Entrada de estoque</h1>
      <p><span class="strong" th:text="${part.name()}">Peça</span> · <span class="mono" th:text="${part.code()}">COD</span> · saldo atual:
        <b th:text="${part.stockQuantity()}">0</b></p>
    </div>
  </div>
  <form class="card form-card" method="post" th:object="${form}"
        th:action="@{/inventory/{id}/stock(id=${part.id()},kind=${kind.name()})}">
    <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    <div class="field">
      <label for="quantity">Quantidade *</label>
      <input id="quantity" type="number" min="1" th:field="*{quantity}" autofocus>
      <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
    </div>
    <div class="field">
      <label for="reason">Motivo</label>
      <div class="input-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg><input id="reason" type="text" maxlength="255" th:field="*{reason}"
             th:placeholder="${kind.name() == 'ENTRADA'} ? 'Compra, devolução...' : 'Venda, uso em OS...'"></div>
      <span class="field-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span>
    </div>
    <div class="form-actions">
      <a class="btn secondary" th:href="@{/inventory}">Cancelar</a>
      <button class="btn" type="submit">Confirmar</button>
    </div>
  </form>
</main>
</body>
</html>
