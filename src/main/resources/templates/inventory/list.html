<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Estoque', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Estoque</h1>
            <p>Controle de peças e movimentações</p>
        </div>
        <a class="btn" th:href="@{/inventory/new}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Nova Peça
        </a>
    </div>

    <div class="card">
        <div class="table-toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" placeholder="Buscar por código, nome ou fabricante..." data-search-table="inventory">
            </div>
            <select class="filter-select" data-filter-table="inventory">
                <option value="">Todos os itens</option>
                <option value="low">Estoque baixo</option>
                <option value="ok">Em estoque</option>
            </select>
        </div>

        <div class="table-wrap">
            <table data-table="inventory">
                <thead>
                <tr><th class="col-fit">Código</th><th class="col-grow">Nome</th><th class="col-grow">Fabricante</th><th class="col-fit num">Estoque</th><th class="col-fit num">Preço de venda</th><th class="col-fit">Status</th><th class="col-actions"></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${parts}" th:attr="data-filter=${p.lowStock() ? 'low' : 'ok'}">
                    <td class="col-fit"><span class="code-pill" th:text="${p.code()}">COD</span></td>
                    <td class="strong col-grow" th:text="${p.name()}">Peça</td>
                    <td class="col-grow" th:text="${@fmt.dash(p.manufacturer())}">—</td>
                    <td class="num mono col-fit num" th:text="${p.stockQuantity()}">0</td>
                    <td class="num mono col-fit num" th:text="${@fmt.currency(p.salePrice())}">R$ 0,00</td>
                    <td class="col-fit"><span class="badge" th:classappend="${p.lowStock()} ? 'rust' : 'moss'"
                              th:text="${p.lowStock()} ? 'Estoque baixo' : 'Em estoque'">Em estoque</span></td>
                    <td class="col-actions">
                        <div class="row-menu" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                            <button type="button" class="menu-btn" aria-label="Ações">⋮</button>
                            <div class="menu-dropdown">
                                <a th:href="@{/inventory/{id}/edit(id=${p.id()})}">Editar</a>
                                <a th:href="@{/inventory/{id}/stock(id=${p.id()},kind='ENTRADA')}" data-modal>Entrada</a>
                                <a th:href="@{/inventory/{id}/stock(id=${p.id()},kind='SAIDA')}" data-modal>Saída</a>
                                <form th:action="@{/inventory/{id}/delete(id=${p.id()})}" method="post"
                                      th:attr="data-confirm='Tem certeza que deseja excluir ' + ${p.name()} + '?'">
                                    <button type="submit" class="danger">Excluir</button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(parts)}">
                    <td colspan="7" style="padding: 0; border: none;">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m7.5 4.27 9 5.15"/>
                                <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                                <path d="m3.3 7 8.7 5 8.7-5"/>
                                <path d="M12 22V12"/>
                            </svg>
                            <h3>Estoque vazio</h3>
                            <p>Cadastre as primeiras peças para controlar a entrada e saída do seu estoque.</p>
                            <a class="btn sm" th:href="@{/inventory/new}" sec:authorize="hasAnyRole('ADMIN','MANAGER')">+ Cadastrar primeira peça</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
