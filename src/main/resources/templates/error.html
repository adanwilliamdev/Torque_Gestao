<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Erro ' + ${status} + ' · Torque Gestão'">Erro · Torque Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('torque-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="login">
    <div class="panel">
        <div class="box error-page">
            <p class="error-code" th:text="${status}">500</p>
            <h2 th:text="${status == 403} ? 'Acesso negado' : (${status == 404} ? 'Página não encontrada' : 'Algo deu errado')">Algo deu errado</h2>
            <p class="muted" style="margin:10px 0 26px"
               th:text="${status == 403} ? 'Você não tem permissão para acessar esta página.' : (${status == 404} ? 'O endereço acessado não existe.' : 'Não foi possível concluir a operação. Tente novamente.')">Tente novamente.</p>
            <a class="btn" th:href="@{/}" style="width:auto">Voltar ao início</a>
        </div>
    </div>
</div>
</body>
</html>
