<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Ordens de serviço', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Ordens de Serviço</h1>
            <p>Acompanhe o ciclo de atendimento da oficina</p>
        </div>
        <a class="btn" th:href="@{/service-orders/new}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Nova Ordem
        </a>
    </div>

    <div class="card">
        <div class="table-toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" placeholder="Buscar por número, cliente ou veículo..." data-search-table="service-orders">
            </div>
            <select class="filter-select" data-filter-table="service-orders">
                <option value="">Todos os status</option>
                <option value="CRIADA">Criada</option>
                <option value="EM_DIAGNOSTICO">Em diagnóstico</option>
                <option value="AGUARDANDO_APROVACAO">Aguardando aprovação</option>
                <option value="APROVADA">Aprovada</option>
                <option value="EM_EXECUCAO">Em execução</option>
                <option value="FINALIZADA">Finalizada</option>
                <option value="CANCELADA">Cancelada</option>
            </select>
        </div>

        <div class="table-wrap">
            <table data-table="service-orders">
                <thead>
                <tr><th>Número</th><th>Cliente</th><th>Veículo</th><th>Mecânico</th><th>Status</th><th class="num">Valor</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}" th:attr="data-filter=${o.status().name()}">
                    <td class="mono strong" th:text="${o.orderNumber()}">OS2026000001</td>
                    <td th:text="${o.clientName()}">Cliente</td>
                    <td th:text="${o.vehicleInfo()}">Veículo</td>
                    <td th:text="${@fmt.dash(o.mechanicName())}">—</td>
                    <td><span class="badge" th:classappend="${@fmt.orderTone(o.status())}"
                              th:text="${o.status().label}">Criada</span></td>
                    <td class="num mono" th:text="${@fmt.currency(o.totalAmount())}">R$ 0,00</td>
                    <td>
                        <div class="row-menu">
                            <button type="button" class="menu-btn" aria-label="Ações">⋮</button>
                            <div class="menu-dropdown">
                                <a th:href="@{/service-orders/{id}/billing(id=${o.id()})}">Faturamento</a>
                                <th:block th:unless="${o.status().closed}">
                                    <!-- ADMIN/MANAGER avançam e cancelam; MECHANIC executa, mas não aprova nem cancela -->
                                    <th:block sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                                        <form th:action="@{/service-orders/{id}/advance(id=${o.id()})}" method="post">
                                            <button type="submit">Avançar status</button>
                                        </form>
                                        <form th:action="@{/service-orders/{id}/cancel(id=${o.id()})}" method="post"
                                              th:attr="data-confirm='Tem certeza que deseja cancelar a OS ' + ${o.orderNumber()} + '?'">
                                            <button type="submit" class="danger">Cancelar OS</button>
                                        </form>
                                    </th:block>
                                    <th:block sec:authorize="hasRole('MECHANIC')">
                                        <form th:unless="${o.status().name() == 'AGUARDANDO_APROVACAO'}"
                                              th:action="@{/service-orders/{id}/advance(id=${o.id()})}" method="post">
                                            <button type="submit">Avançar status</button>
                                        </form>
                                    </th:block>
                                </th:block>
                            </div>
                        </div>
                    </td>
                </tr>
                <!-- ... cabeçalho mantido ... -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" style="padding: 0; border: none;">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="8" y="2" width="8" height="4" rx="1"/>
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                <path d="M12 11h4"/><path d="M12 16h4"/>
                                <path d="M8 11h.01"/><path d="M8 16h.01"/>
                            </svg>
                            <h3>Nenhuma ordem de serviço</h3>
                            <p sec:authorize="hasRole('MECHANIC')">Nenhuma ordem atribuída a você no momento.</p>
                            <p sec:authorize="!hasRole('MECHANIC')">Comece abrindo uma nova Ordem de Serviço.</p>
                        </div>
                    </td>
                </tr>
                <!-- ... fechamento mantido ... -->
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
