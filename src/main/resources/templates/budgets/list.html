<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Orçamentos', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Orçamentos</h1>
            <p>Acompanhe e aprove os orçamentos da oficina</p>
        </div>
        <a class="btn" th:href="@{/budgets/new}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Novo Orçamento
        </a>
    </div>

    <div class="card">
        <div class="table-toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="search" placeholder="Buscar por número, cliente ou veículo..." data-search-table="budgets">
            </div>
            <select class="filter-select" data-filter-table="budgets">
                <option value="">Todos os status</option>
                <option value="PENDENTE">Pendente</option>
                <option value="APROVADO">Aprovado</option>
                <option value="RECUSADO">Recusado</option>
                <option value="EXPIRADO">Expirado</option>
            </select>
        </div>

        <div class="table-wrap">
            <table data-table="budgets">
                <thead>
                <tr><th class="col-fit">Número</th><th class="col-grow">Cliente</th><th class="col-grow">Veículo</th><th class="col-fit num">Valor</th><th class="col-fit">Validade</th><th class="col-fit">Status</th><th class="col-actions"></th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${budgets}" th:attr="data-filter=${b.status().name()}">
                    <td class="col-fit"><span class="code-pill" th:text="${b.budgetNumber()}">BUD2026000001</span></td>
                    <td class="col-grow" th:text="${b.clientName()}">Cliente</td>
                    <td class="col-grow" th:text="${b.vehicleInfo()}">Veículo</td>
                    <td class="num mono col-fit num" th:text="${@fmt.currency(b.totalAmount())}">R$ 0,00</td>
                    <td class="col-fit" th:text="${@fmt.date(b.validUntil())}">—</td>
                    <td class="col-fit"><span class="badge" th:classappend="${@fmt.budgetTone(b.status())}"
                              th:text="${b.status().label}">Pendente</span></td>
                    <td class="col-actions">
                        <div class="row-menu" sec:authorize="hasAnyRole('ADMIN','MANAGER')"
                             th:if="${b.status().name() == 'PENDENTE'}">
                            <button type="button" class="menu-btn" aria-label="Ações">⋮</button>
                            <div class="menu-dropdown">
                                <form th:action="@{/budgets/{id}/approve(id=${b.id()})}" method="post">
                                    <button type="submit">Aprovar</button>
                                </form>
                                <form th:action="@{/budgets/{id}/reject(id=${b.id()})}" method="post"
                                      th:attr="data-confirm='Recusar o orçamento ' + ${b.budgetNumber()} + '?'">
                                    <button type="submit" class="danger">Recusar</button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(budgets)}">
                    <td colspan="7" style="padding: 0; border: none;">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
                                <path d="M12 18V6"/>
                            </svg>
                            <h3>Nenhum orçamento cadastrado</h3>
                            <p>Crie um novo orçamento para enviar aos seus clientes.</p>
                            <a class="btn sm" th:href="@{/budgets/new}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST')">+ Criar primeiro orçamento</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
