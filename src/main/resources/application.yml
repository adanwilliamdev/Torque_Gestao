server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: torque-gestao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/torque}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carrega coleções/associações lazy em lote: paginação sem N+1
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 1s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    default-property-inclusion: always
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/swagger-ui

app:
  environment: ${ENVIRONMENT:development}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-para-uma-string-longa-e-aleatoria}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  login-rate-limit-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:10}
  login-rate-limit-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  dashboard-cache-ttl-seconds: ${DASHBOARD_CACHE_TTL_SECONDS:30}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@torquegestao.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}

logging:
  level:
    com.torquegestao: INFO
