services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: torque
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d torque"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/torque
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Valor padrão SÓ para desenvolvimento local: em produção o app recusa iniciar com ele.
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-para-uma-string-longa-e-aleatoria}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@torquegestao.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}

volumes:
  pgdata:
